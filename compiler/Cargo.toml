[package]
name = "lucid"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[features]
# Removes overflow checks, only to measure their cost. See docs/compiler.md.
bench-unchecked = []

[dependencies]
cranelift-codegen = "0.137.1"
cranelift-frontend = "0.137.1"
cranelift-jit = "0.137.1"
cranelift-module = "0.137.1"
cranelift-object = "0.137.1"
lucid_rt = { path = "../runtime" }

[target."cfg(windows)".dependencies]
find-msvc-tools = "0.1.15"
