[package]
name = "lucid_backend"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[features]
# The C `main` of a built program, in the library that `build.rs` makes for
# a program that calls the backend, by decision 217.
exe = ["lucid_rt/exe"]
# Removes overflow checks, only to measure their cost. See docs/compiler.md.
bench-unchecked = []

[dependencies]
cranelift-codegen = "0.137.1"
cranelift-frontend = "0.137.1"
cranelift-jit = "0.137.1"
cranelift-module = "0.137.1"
cranelift-object = "0.137.1"
lucid_rt = { path = "../runtime" }
wasm-encoder = "0.255.0"

[target."cfg(windows)".dependencies]
find-msvc-tools = "0.1.15"
