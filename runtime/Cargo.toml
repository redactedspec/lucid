[package]
name = "lucid_rt"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later WITH Classpath-exception-2.0"

[dependencies]

[features]
# The C `main` of a built program. Only `compiler/build.rs` turns it on.
exe = []

# TLS for the `std.http` client, by decision 179. Native targets only.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1.0.11"
