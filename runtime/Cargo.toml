[package]
name = "lucid_rt"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later WITH Classpath-exception-2.0"

[dependencies]

[features]
# The C `main` of a built program. Only `backend/build.rs` turns it on.
exe = []

# TLS for the `std.http` client, by decision 179. Native targets only.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1.0.11"
# Argon2id passwords for `std.crypto`, by decision 193.
argon2 = { version = "0.6.0", default-features = false, features = ["alloc", "password-hash"] }
ring = { version = "0.17.14", default-features = false }
# Constant-time compare for `crypto.same`. `rustls` already builds it.
subtle = "2.6.1"
# SQLite for `std.sql`, by decision 194. `bundled` builds one pinned version.
libsqlite3-sys = { version = "0.39.1", features = ["bundled"] }
